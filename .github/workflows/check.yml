# Validates macro headers and does a full compendium build on every push and PR.

name: Check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Check automation syntax
        run: for f in automation/*.mjs; do node --check "$f"; done
      - run: npm run build
