# Publishing a GitHub release (tag like v0.1.0) builds the compendium,
# stamps module.json with that version, and attaches module.json + module.zip
# to the release. Foundry installs from:
#   https://github.com/Mossback-Games/mossback-pf2e-toolkit/releases/latest/download/module.json

name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Stamp version
        run: npm run release:prep -- "${{ github.event.release.tag_name }}"

      - name: Build compendium
        run: npm run build

      - name: Package
        run: zip -r module.zip module.json automation packs README.md LICENSE CHANGELOG.md

      - name: Attach to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" module.json module.zip --clobber
